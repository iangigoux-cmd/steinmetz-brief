<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Steinmetz — LAB 9 · El azul</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231832e6'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,400..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root { --azul:#1832e6; --blanco:#ffffff; --velado:rgba(255,255,255,0.55); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--azul); color:var(--blanco);
    font-family:"Anybody",sans-serif; height:100svh; overflow:hidden;
    -webkit-font-smoothing:antialiased; }
  ::selection { background:var(--blanco); color:var(--azul); }

  /* formas geométricas que derivan solas, muy lento */
  .forma { position:fixed; pointer-events:none; opacity:.16; }
  .forma.circulo { width:44vmin; height:44vmin; border:2.5px solid var(--blanco);
    border-radius:50%; top:-12vmin; right:-8vmin;
    animation:derivar1 26s ease-in-out infinite alternate; }
  .forma.anillo { width:70vmin; height:70vmin; border:1.5px solid var(--blanco);
    border-radius:50%; bottom:-30vmin; left:-18vmin;
    animation:derivar2 34s ease-in-out infinite alternate; }
  .forma.disco { width:16vmin; height:16vmin; background:var(--blanco);
    border-radius:50%; top:58%; right:16%;
    animation:derivar3 20s ease-in-out infinite alternate; opacity:.9; }
  @keyframes derivar1 { to { transform:translate(-6vmin, 8vmin) rotate(30deg); } }
  @keyframes derivar2 { to { transform:translate(8vmin, -6vmin); } }
  @keyframes derivar3 { to { transform:translate(-10vmin, -14vmin) scale(.75); } }

  .marco { position:relative; z-index:2; height:100svh; display:grid;
    grid-template-rows:auto 1fr auto; padding:clamp(1.4rem,3vw,2.4rem); }

  header, footer { display:flex; justify-content:space-between;
    font-family:"IBM Plex Mono",monospace; font-size:.68rem;
    letter-spacing:.22em; color:var(--velado); }
  header b { color:var(--blanco); font-weight:500; }

  main { display:flex; flex-direction:column; justify-content:center; }

  h1 { font-size:clamp(3rem,10vw,9.5rem); font-weight:850; font-stretch:112%;
    line-height:.94; letter-spacing:-.03em; text-transform:uppercase;
    max-width:9em; }
  h1 .l { display:block; overflow:hidden; }
  h1 .l span { display:block; padding-top:.14em; margin-bottom:-.14em;
    transform:translateY(108%); animation:rev 1s cubic-bezier(.19,1,.22,1) forwards; }
  @keyframes rev { to { transform:none; } }
  h1 .contorno { color:transparent; -webkit-text-stroke:2px var(--blanco); }

  .fila-baja { display:flex; align-items:center; gap:2.5rem; margin-top:2.6rem;
    opacity:0; animation:fundir 1s ease-out 1s forwards; }
  @keyframes fundir { to { opacity:1; } }
  .fila-baja p { max-width:26em; font-family:"IBM Plex Mono",monospace;
    font-size:clamp(.75rem,1vw,.85rem); line-height:1.9; letter-spacing:.06em;
    color:var(--velado); }

  .cta { display:inline-block; flex-shrink:0;
    font-family:"IBM Plex Mono",monospace; font-size:.78rem; font-weight:500;
    letter-spacing:.24em; text-decoration:none; color:var(--azul);
    background:var(--blanco); padding:1.15em 2.4em; border-radius:100px;
    transition:transform 250ms cubic-bezier(.19,1,.22,1), box-shadow 250ms ease; }
  .cta:hover { transform:scale(1.06) rotate(-1.5deg);
    box-shadow:0 12px 40px rgba(0,0,0,.25); }

  @media (max-width:700px) { .fila-baja { flex-direction:column; align-items:flex-start; gap:1.4rem; } }
  @media (prefers-reduced-motion:reduce) {
    .forma, h1 .l span, .fila-baja { animation:none; opacity:1; transform:none; }
    .forma.circulo, .forma.anillo { opacity:.16; } .forma.disco { opacity:.9; }
  }
</style>
</head>
<body>
<div class="forma circulo"></div>
<div class="forma anillo"></div>
<div class="forma disco"></div>

<div class="marco">
  <header>
    <b>STEINMETZ</b>
    <span>SUBTÍTULO GENÉRICO</span>
  </header>

  <main>
    <h1 aria-label="Un titular fuerte aquí.">
      <span class="l"><span style="animation-delay:.2s">Un titular</span></span>
      <span class="l"><span style="animation-delay:.34s" class="contorno">fuerte</span></span>
      <span class="l"><span style="animation-delay:.48s">aquí.</span></span>
    </h1>
    <div class="fila-baja">
      <a class="cta" href="mailto:ian@steinmetz.cl">CONTACTO</a>
      <p>DOS FRASES DE APOYO QUE BAJAN LA IDEA PRINCIPAL.
      TEXTO DE RELLENO, SOLO PARA EVALUAR EL DISEÑO.</p>
    </div>
  </main>

  <footer>
    <span>SANTIAGO DE CHILE</span>
    <span>LAB 9 — EL AZUL</span>
  </footer>
</div>







</body>
</html>
