<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Steinmetz — LAB 5 · La grilla</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ffffff'/%3E%3Crect x='4' y='4' width='24' height='24' fill='none' stroke='%23000' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --blanco: #ffffff;
    --negro: #0c0c0c;
    --gris: #86868b;
    --linea: #0c0c0c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--blanco); color: var(--negro);
    font-family: "Inter Tight", sans-serif;
    height: 100svh; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--negro); color: var(--blanco); }

  .marco { height: 100svh; display: grid;
    grid-template-rows: auto 1fr auto auto;
    border: 2.5px solid var(--linea); margin: clamp(0.6rem, 1.5vw, 1.2rem); }

  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    border-bottom: 2.5px solid var(--linea);
    font-family: "IBM Plex Mono", monospace; font-size: 0.7rem;
    letter-spacing: 0.18em; }
  header > * { padding: 1rem 1.4rem; }
  header .centro-h { border-inline: 2.5px solid var(--linea); text-align: center; }
  header .der { text-align: right; color: var(--gris); }

  main { position: relative; display: flex; align-items: center; overflow: hidden;
    padding: clamp(1rem, 3vw, 3rem); }

  h1 { font-size: clamp(3.2rem, 11.5vw, 11rem); font-weight: 900;
    line-height: 0.88; letter-spacing: -0.045em; text-transform: uppercase; }
  h1 .l { display: block; overflow: hidden; }
  h1 .l span { display: block; padding-top: 0.14em; margin-bottom: -0.14em; transform: translateY(105%);
    animation: rev 0.9s cubic-bezier(0.19,1,0.22,1) forwards; }
  @keyframes rev { to { transform: none; } }
  h1 .hueco { color: transparent; -webkit-text-stroke: 2.5px var(--negro); }

  /* reloj técnico giratorio, autónomo */
  .sello { position: absolute; right: clamp(1rem, 4vw, 4rem); top: 50%;
    width: clamp(7rem, 13vw, 11rem); aspect-ratio: 1;
    transform: translateY(-50%);
    opacity: 0; animation: fundir 1s ease-out 1.1s forwards; }
  @keyframes fundir { to { opacity: 1; } }
  .sello svg { width: 100%; height: 100%; animation: girar 30s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .sello text { font-family: "IBM Plex Mono", monospace; font-size: 8.2px;
    letter-spacing: 0.32em; fill: var(--negro); }
  .sello circle { fill: none; stroke: var(--linea); stroke-width: 1.5; }

  .fila-datos { display: grid; grid-template-columns: repeat(3, 1fr);
    border-top: 2.5px solid var(--linea); }
  .dato { padding: 1.1rem 1.4rem; cursor: default;
    transition: background 160ms ease, color 160ms ease; }
  .dato + .dato { border-left: 2.5px solid var(--linea); }
  .dato:hover { background: var(--negro); color: var(--blanco); }
  .dato b { display: block; font-size: clamp(1rem, 1.7vw, 1.5rem); font-weight: 700;
    letter-spacing: -0.02em; }
  .dato span { font-family: "IBM Plex Mono", monospace; font-size: 0.62rem;
    letter-spacing: 0.2em; color: var(--gris); }
  .dato:hover span { color: rgba(255,255,255,0.6); }

  footer { display: flex; justify-content: space-between; align-items: center;
    border-top: 2.5px solid var(--linea); }
  .cta { flex: 1; text-align: center; padding: 1.3rem;
    font-family: "IBM Plex Mono", monospace; font-size: 0.8rem; font-weight: 500;
    letter-spacing: 0.3em; text-decoration: none;
    color: var(--blanco); background: var(--negro);
    transition: letter-spacing 300ms cubic-bezier(0.19,1,0.22,1); }
  .cta:hover { letter-spacing: 0.5em; }
  footer .lab { padding: 1.3rem 1.4rem; font-family: "IBM Plex Mono", monospace;
    font-size: 0.62rem; letter-spacing: 0.2em; color: var(--gris);
    border-left: 2.5px solid var(--linea); white-space: nowrap; }

  .sube { opacity: 0; animation: fundir 0.8s ease-out forwards; }

  @media (max-width: 700px) {
    header .der, .sello { display: none; }
    header { grid-template-columns: 1fr auto; }
    .fila-datos { grid-template-columns: 1fr; }
    .dato + .dato { border-left: none; border-top: 2.5px solid var(--linea); }
  }
  @media (prefers-reduced-motion: reduce) {
    h1 .l span, .sube, .sello { animation: none; opacity: 1; transform: none; }
    h1 .l span { transform: none; }
    .sello { transform: translateY(-50%); }
    .sello svg { animation: none; }
  }
</style>
</head>
<body>
<div class="marco">
  <header>
    <b class="sube" style="animation-delay:.1s">STEINMETZ</b>
    <span class="centro-h sube" style="animation-delay:.2s">CONSULTORÍA EN IA</span>
    <span class="der sube" style="animation-delay:.3s">SCL 33.45°S — 2026</span>
  </header>

  <main>
    <h1 aria-label="Menos slides. Más sistemas.">
      <span class="l"><span style="animation-delay:.35s">Menos</span></span>
      <span class="l"><span style="animation-delay:.47s" class="hueco">slides.</span></span>
      <span class="l"><span style="animation-delay:.59s">Más</span></span>
      <span class="l"><span style="animation-delay:.71s">sistemas.</span></span>
    </h1>
    <div class="sello" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="48.5"/>
        <circle cx="50" cy="50" r="30"/>
        <path id="orbita" d="M 50,50 m -39,0 a 39,39 0 1,1 78,0 a 39,39 0 1,1 -78,0" fill="none"/>
        <text><textPath href="#orbita">ENCENDIDO O NO EXISTE · ENCENDIDO O NO EXISTE ·&#160;</textPath></text>
      </svg>
    </div>
  </main>

  <div class="fila-datos">
    <div class="dato sube" style="animation-delay:.85s">
      <span>MÉTODO</span><b>Diagnóstico sobre la operación real</b>
    </div>
    <div class="dato sube" style="animation-delay:.95s">
      <span>CONSTRUCCIÓN</span><b>Sistemas de IA dentro de tu red</b>
    </div>
    <div class="dato sube" style="animation-delay:1.05s">
      <span>CRITERIO DE TÉRMINO</span><b>Corriendo en producción</b>
    </div>
  </div>

  <footer>
    <a class="cta" href="mailto:ian@steinmetz.cl">HABLEMOS — IAN@STEINMETZ.CL</a>
    <span class="lab">LAB 5 — LA GRILLA</span>
  </footer>
</div>






<!-- conmutador del lab: solo para comparar versiones, no es parte del diseño -->
<style>
  .lab-nav { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    z-index: 99; display: flex; flex-wrap: wrap; justify-content: center;
    max-width: 94vw; gap: 3px; padding: 5px;
    background: rgba(12,12,12,0.82); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.18); border-radius: 100px;
    font-family: ui-monospace, monospace; font-size: 11px; }
  .lab-nav a { display: grid; place-content: center; min-width: 26px; height: 26px;
    border-radius: 50%; color: rgba(255,255,255,0.65); text-decoration: none;
    transition: background 150ms, color 150ms; padding: 0 2px; }
  .lab-nav a:hover { background: rgba(255,255,255,0.15); color: #fff; }
  .lab-nav a.aqui { background: #fff; color: #0c0c0c; }
</style>
<nav class="lab-nav">
  <a href="/lab/" title="índice">≡</a>
  <a href="/lab/1/">1</a><a href="/lab/3/">3</a><a href="/lab/4/">4</a><a href="/lab/5/">5</a><a href="/lab/7/">7</a><a href="/lab/9/">9</a><a href="/lab/11/">11</a><a href="/lab/13/">13</a><a href="/lab/14/">14</a><a href="/lab/15/">15</a><a href="/lab/17/">17</a><a href="/lab/18/">18</a><a href="/lab/19/">19</a><a href="/lab/20/">20</a><a href="/lab/21/">21</a>
</nav>
<script>
(function () {
  var seq = [1, 3, 4, 5, 7, 9, 11, 13, 14, 15, 17, 18, 19, 20, 21];
  var n = parseInt(location.pathname.match(/lab\/(\d+)/)[1], 10);
  var i = seq.indexOf(n);
  document.querySelectorAll(".lab-nav a")[i + 1].classList.add("aqui");
  addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" && i < seq.length - 1) location.href = "/lab/" + seq[i + 1] + "/";
    if (e.key === "ArrowLeft" && i > 0) location.href = "/lab/" + seq[i - 1] + "/";
  });
})();
</script>
</body>
</html>
