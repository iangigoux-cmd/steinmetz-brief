<style>
  :root { --papel:#ffffff; --tinta:#111112; --medio:#9a9a9e; --linea:rgba(17,17,18,0.14); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--papel); color:var(--tinta);
    font-family:"Fraunces",serif; height:100svh; overflow:hidden;
    -webkit-font-smoothing:antialiased; }
  ::selection { background:var(--tinta); color:var(--papel); }

  .marco { height:100svh; display:grid; grid-template-rows:auto 1fr auto;
    padding:clamp(1.4rem,3vw,2.4rem); }

  header, footer { display:flex; justify-content:space-between;
    font-family:"IBM Plex Mono",monospace; font-size:.68rem;
    letter-spacing:.22em; color:var(--medio); }
  header b { color:var(--tinta); font-weight:500; }

  main { display:flex; flex-direction:column; justify-content:center;
    align-items:center; text-align:center; }

  /* la palabra: cada letra es un span con su propio eje de peso */
  .palabra { display:flex; user-select:none; cursor:default;
    font-optical-sizing:auto; line-height:1;
    font-size:clamp(3rem, 13.5vw, 15rem); letter-spacing:-0.03em; }
  .palabra span {
    font-variation-settings: "wght" 340, "opsz" 144;
    transition:none; display:inline-block;
    opacity:0; transform:translateY(30px);
    animation:entrar .9s cubic-bezier(.19,1,.22,1) forwards;
  }
  @keyframes entrar { to { opacity:1; transform:none; } }

  .bajo { margin-top:2.4rem; font-family:"IBM Plex Mono",monospace;
    font-size:clamp(.7rem,1vw,.8rem); letter-spacing:.28em; color:var(--medio);
    opacity:0; animation:fundir 1s ease-out 1.3s forwards; }
  @keyframes fundir { to { opacity:1; } }

  .cta { display:inline-block; margin-top:2rem;
    font-family:"IBM Plex Mono",monospace; font-size:.75rem; font-weight:500;
    letter-spacing:.24em; text-decoration:none; color:var(--papel);
    background:var(--tinta); padding:1.05em 2.2em; border-radius:100px;
    opacity:0; animation:fundir 1s ease-out 1.55s forwards;
    transition:transform 250ms cubic-bezier(.19,1,.22,1); }
  .cta:hover { transform:scale(1.05); }

  footer { align-items:baseline; }

  @media (prefers-reduced-motion:reduce) {
    .palabra span, .bajo, .cta { animation:none; opacity:1; transform:none; }
  }
</style>
</head>
<body>
<div class="marco">
  <header>
    <b>STEINMETZ</b>
    <span>SUBTÍTULO GENÉRICO</span>
  </header>

  <main>
    <div class="palabra" id="palabra" aria-label="Steinmetz">
      <span style="animation-delay:.15s">S</span><span style="animation-delay:.21s">t</span><span style="animation-delay:.27s">e</span><span style="animation-delay:.33s">i</span><span style="animation-delay:.39s">n</span><span style="animation-delay:.45s">m</span><span style="animation-delay:.51s">e</span><span style="animation-delay:.57s">t</span><span style="animation-delay:.63s">z</span>
    </div>
    <p class="bajo">UNA LÍNEA DE APOYO GENÉRICA — TEXTO DE RELLENO</p>
    <a class="cta" href="mailto:ian@steinmetz.cl">CONTACTO</a>
  </main>

  <footer>
    <span>SANTIAGO DE CHILE</span>
    <span>LAB 7 — LAS LETRAS</span>
  </footer>
</div>

<script>
/* Tipografía magnética: el peso y el tamaño óptico de cada letra responden
   a la distancia del puntero — la palabra se siente viva al pasar por encima. */
(function () {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var letras = Array.prototype.slice.call(document.querySelectorAll("#palabra span"));
  var mx = -9999, objetivo = letras.map(function () { return 340; });

  addEventListener("pointermove", function (e) { mx = e.clientX; my = e.clientY; }, { passive: true });
  var my = -9999;

  function frame() {
    letras.forEach(function (el, i) {
      var r = el.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      var d = Math.hypot(mx - cx, my - cy);
      var cerca = Math.max(0, 1 - d / 320);            // 0..1
      var destino = 340 + cerca * cerca * 560;          // wght 340 → 900
      objetivo[i] += (destino - objetivo[i]) * 0.12;    // inercia
      el.style.fontVariationSettings = '"wght" ' + objetivo[i].toFixed(1) + ', "opsz" 144';
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
