<title>Steinmetz — LAB 14 · La señal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0b'/%3E%3Ccircle cx='10' cy='16' r='1.5' fill='%23999'/%3E%3Ccircle cx='16' cy='16' r='1.5' fill='%23999'/%3E%3Ccircle cx='22' cy='16' r='2.5' fill='%23fff'/%3E%3C/svg%3E">

<style>
  :root { --fondo:#0a0a0b; --claro:#f0f0ee; --medio:#66666b; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--fondo); color:var(--claro);
    font-family:"Hanken Grotesk",sans-serif; height:100svh; overflow:hidden;
    -webkit-font-smoothing:antialiased; }
  ::selection { background:var(--claro); color:var(--fondo); }

  canvas#senal { position:fixed; inset:0; width:100%; height:100%; }

  .marco { position:relative; z-index:2; height:100svh; display:grid;
    grid-template-rows:auto 1fr auto; padding:clamp(1.4rem,3vw,2.4rem);
    pointer-events:none; text-align:center; }
  .marco a { pointer-events:auto; }

  header, footer { display:flex; justify-content:space-between;
    font-family:"IBM Plex Mono",monospace; font-size:.68rem;
    letter-spacing:.22em; color:var(--medio); }
  header b { color:var(--claro); font-weight:500; }

  main { display:flex; flex-direction:column; justify-content:end; align-items:center;
    padding-bottom:4svh; }

  .sube { opacity:0; transform:translateY(12px);
    animation:subir 1s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes subir { to { opacity:1; transform:none; } }

  .bajada { max-width:36em; color:var(--medio);
    font-size:clamp(.95rem,1.2vw,1.08rem); line-height:1.7; }
  .bajada b { color:var(--claro); font-weight:600; }
  .cta { display:inline-block; margin-top:1.6rem;
    font-family:"IBM Plex Mono",monospace; font-size:.75rem; font-weight:500;
    letter-spacing:.24em; text-decoration:none; color:var(--fondo);
    background:var(--claro); padding:1.05em 2.2em; border-radius:100px;
    transition:transform 250ms cubic-bezier(.16,1,.3,1); }
  .cta:hover { transform:scale(1.05); }

  @media (prefers-reduced-motion:reduce) {
    .sube { animation:none; opacity:1; transform:none; }
  }
</style>
</head>
<body>
<canvas id="senal"></canvas>

<div class="marco">
  <header>
    <b class="sube" style="animation-delay:.2s">STEINMETZ</b>
    <span class="sube" style="animation-delay:.35s">CONSULTORÍA EN IA</span>
  </header>

  <main>
    <p class="bajada sube" style="animation-delay:2.2s">Tu operación genera miles de
    datos al día. <b>La diferencia no está en tener más — está en saber dónde
    mirar.</b> Steinmetz convierte ese ruido en el sistema que decide.</p>
    <a class="cta sube" style="animation-delay:2.5s" href="mailto:ian@steinmetz.cl">ORDENAR MI RUIDO</a>
  </main>

  <footer>
    <span class="sube" style="animation-delay:2.7s">SANTIAGO DE CHILE</span>
    <span class="sube" style="animation-delay:2.8s">LAB 14 — LA SEÑAL</span>
  </footer>
</div>

<script>
/* El mensaje ejecutado: caos de partículas que se ordena solo hasta formar
   "SABER DÓNDE". El cursor las dispersa; el sistema siempre se reorganiza. */
(function () {
  var reducido = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var canvas = document.getElementById("senal");
  var ctx = canvas.getContext("2d");
  var dpr = 1, W = 0, H = 0, parts = [];
  var mx = -9999, my = -9999;

  function muestrearTexto() {
    // dibuja el texto fuera de pantalla y muestrea sus pixeles
    var off = document.createElement("canvas");
    var octx = off.getContext("2d");
    off.width = W; off.height = H;
    var fs = Math.min(W / 7.2, H / 4.2);
    octx.font = "600 " + fs + "px 'Hanken Grotesk', sans-serif";
    octx.textAlign = "center"; octx.textBaseline = "middle";
    octx.fillStyle = "#fff";
    octx.fillText("SABER", W / 2, H * 0.30);
    octx.fillText("DÓNDE.", W / 2, H * 0.30 + fs * 1.02);
    var data = octx.getImageData(0, 0, W, H).data;
    var puntos = [], paso = Math.max(4, Math.round(W / 240));
    for (var y = 0; y < H; y += paso)
      for (var x = 0; x < W; x += paso)
        if (data[(y * W + x) * 4 + 3] > 128) puntos.push([x, y]);
    return puntos;
  }

  function armar() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    var destinos = muestrearTexto();
    parts = destinos.map(function (d) {
      return {
        x: Math.random() * W, y: Math.random() * H,          // nace en el caos
        vx: (Math.random() - .5) * 2, vy: (Math.random() - .5) * 2,
        tx: d[0], ty: d[1],
        r: 0.8 + Math.random() * 1.1,
      };
    });
  }

  // las fuentes web cargan tarde: re-muestrear cuando estén listas
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(armar);
  addEventListener("resize", armar);
  armar();

  addEventListener("pointermove", function (e) { mx = e.clientX; my = e.clientY; }, { passive: true });

  var t0 = performance.now();
  function frame(now) {
    if (!document.hidden) {
      var t = (now - t0) / 1000;
      // primeros 1.6s: caos puro; después la atracción crece y ordena todo
      var orden = Math.min(1, Math.max(0, (t - 1.2) / 1.8));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#f0f0ee";
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        // atracción al destino (la señal)
        p.vx += (p.tx - p.x) * 0.0022 * orden;
        p.vy += (p.ty - p.y) * 0.0022 * orden;
        // el cursor perturba
        var dx = p.x - mx, dy = p.y - my, d2 = dx * dx + dy * dy;
        if (d2 < 10000) { var f = (1 - Math.sqrt(d2) / 100) * 2.4; p.vx += (dx / 100) * f; p.vy += (dy / 100) * f; }
        // deriva del caos inicial
        p.vx += (Math.random() - .5) * 0.08 * (1 - orden);
        p.vy += (Math.random() - .5) * 0.08 * (1 - orden);
        p.vx *= 0.9; p.vy *= 0.9;
        p.x += p.vx; p.y += p.vy;
        var cerca = Math.abs(p.x - p.tx) + Math.abs(p.y - p.ty) < 4;
        ctx.globalAlpha = 0.35 + orden * 0.65 * (cerca ? 1 : 0.7);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    if (!reducido) requestAnimationFrame(frame);
  }

  if (reducido) {
    // sin movimiento: el texto ya ordenado
    parts.forEach(function (p) { p.x = p.tx; p.y = p.ty; });
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#f0f0ee";
    parts.forEach(function (p) { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill(); });
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>

<script>
(function () {
  var fin = [1, 3, 4, 5, 7, 9, 11, 13, 14, 15];
  var n = parseInt(location.pathname.match(/lab\/(\d+)/)[1], 10);
  var i = fin.indexOf(n);
  document.querySelectorAll(".lab-nav a")[i + 1].classList.add("aqui");
  addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" && i < fin.length - 1) location.href = "/lab/" + fin[i + 1] + "/";
    if (e.key === "ArrowLeft" && i > 0) location.href = "/lab/" + fin[i - 1] + "/";
  });
})();
