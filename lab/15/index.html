<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Steinmetz — LAB 15 · El despeje</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f4f1ea'/%3E%3Cpath d='M8 16 L24 16 M16 8 L16 24' stroke='%23191713' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root { --papel:#f4f1ea; --tinta:#191713; --medio:#8a857a; --rojo:#c2401b; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--papel); color:var(--tinta);
    font-family:"Albert Sans",sans-serif; height:100svh; overflow:hidden;
    -webkit-font-smoothing:antialiased; }
  ::selection { background:var(--tinta); color:var(--papel); }

  .marco { position:relative; z-index:1; height:100svh; display:grid;
    grid-template-rows:auto 1fr auto; padding:clamp(1.4rem,3vw,2.4rem); }

  header, footer { display:flex; justify-content:space-between;
    font-family:"IBM Plex Mono",monospace; font-size:.68rem;
    letter-spacing:.22em; color:var(--medio); }
  header b { color:var(--tinta); font-weight:500; }

  main { display:flex; flex-direction:column; justify-content:center; max-width:56rem; }

  /* el mensaje que queda cuando todo cae */
  h1 { font-size:clamp(2.6rem,6.6vw,5.8rem); font-weight:800;
    line-height:1.0; letter-spacing:-.035em;
    opacity:0; transform:translateY(10px);
    animation:aparecer .9s cubic-bezier(.16,1,.3,1) 3.1s forwards; }
  h1 em { font-style:normal; color:var(--rojo); }
  .bajada { margin-top:1.5rem; max-width:30em; color:var(--medio);
    font-size:clamp(.98rem,1.25vw,1.12rem); line-height:1.65;
    opacity:0; animation:aparecer .9s ease-out 3.4s forwards; }
  .bajada b { color:var(--tinta); font-weight:600; }
  .cta { display:inline-block; align-self:start; margin-top:2.2rem;
    font-family:"IBM Plex Mono",monospace; font-size:.75rem; font-weight:500;
    letter-spacing:.24em; text-decoration:none; color:var(--papel);
    background:var(--tinta); padding:1.1em 2.3em;
    opacity:0; animation:aparecer .9s ease-out 3.65s forwards;
    transition:background 250ms ease; }
  .cta:hover { background:var(--rojo); }
  @keyframes aparecer { to { opacity:1; transform:none; } }

  /* ── la capa de entregables: tapa todo y después cae ── */
  .pila { position:fixed; inset:0; z-index:3; pointer-events:none; }
  .doc { position:absolute; background:#fff; border:1px solid rgba(25,23,19,.14);
    box-shadow:0 10px 30px rgba(25,23,19,.14);
    padding:1.1rem 1.3rem; width:15.5rem;
    font-size:.82rem; line-height:1.5; color:var(--tinta); }
  .doc .tipo { font-family:"IBM Plex Mono",monospace; font-size:.58rem;
    letter-spacing:.2em; color:var(--medio); display:block; margin-bottom:.4rem; }
  .doc b { font-weight:700; font-size:.95rem; letter-spacing:-.01em; }
  .doc .meta { margin-top:.55rem; font-family:"IBM Plex Mono",monospace;
    font-size:.6rem; color:var(--medio); }

  /* caída: cada documento se desploma con su propio timing */
  .cae .doc { animation:caer 1.1s cubic-bezier(.5,.05,.9,.4) forwards; }
  @keyframes caer { to { transform:translateY(130vh) rotate(var(--giro,18deg)); } }

  @media (max-width:720px) { .doc { width:11.5rem; padding:.8rem 1rem; } .doc b { font-size:.82rem; } }
  @media (prefers-reduced-motion:reduce) {
    .pila { display:none; }
    h1, .bajada, .cta { animation:none; opacity:1; transform:none; }
  }
</style>
</head>
<body>

<div class="marco">
  <header>
    <b>STEINMETZ</b>
    <span>CONSULTORÍA EN IA</span>
  </header>

  <main>
    <h1>Nada de esto<br>enciende un sistema.<br><em>Lo nuestro sí.</em></h1>
    <p class="bajada">La consultoría tradicional entrega papeles. <b>Steinmetz
    entrega sistemas de IA corriendo en tu operación</b> — y se mide por eso.</p>
    <a class="cta" href="mailto:ian@steinmetz.cl">DESPEJAR MI OPERACIÓN</a>
  </main>

  <footer>
    <span>SANTIAGO DE CHILE</span>
    <span>LAB 15 — EL DESPEJE</span>
  </footer>
</div>

<div class="pila" id="pila" aria-hidden="true"></div>

<script>
/* La pantalla llega tapada de entregables de consultora. La página los
   barre sola: caen por su propio peso y queda el mensaje. */
(function () {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var DOCS = [
    ["PRESENTACIÓN", "Roadmap_Estrategico_Q3_v14_FINAL_FINAL.pptx", "84 diapositivas · 6 MB"],
    ["ACTA", "Comité de Seguimiento — sesión 11", "acuerdos: agendar próxima sesión"],
    ["PLANILLA", "Matriz RACI (borrador)", "última edición: hace 7 meses"],
    ["INFORME", "Diagnóstico de Madurez Digital", "312 páginas · sin leer"],
    ["INVITACIÓN", "Workshop de Alineamiento Estratégico", "obligatorio · 4 horas"],
    ["MINUTA", "Kick-off del Kick-off", "se define el alcance del alcance"],
    ["ENTREGABLE", "Framework de Transformación v2", "pendiente de validación del comité"],
    ["PRESENTACIÓN", "Quick Wins — Fase 0", "ningún win registrado"],
    ["PLAN", "Plan de Gestión del Cambio", "el cambio sigue pendiente"],
    ["INFORME", "Benchmark Internacional", "conclusión: hacer otro benchmark"],
  ];
  var pila = document.getElementById("pila");
  var W = innerWidth, H = innerHeight;
  DOCS.forEach(function (d, i) {
    var el = document.createElement("div");
    el.className = "doc";
    el.innerHTML = '<span class="tipo">' + d[0] + '</span><b>' + d[1] + '</b><div class="meta">' + d[2] + '</div>';
    // desparramados cubriendo el centro de la pantalla
    var col = i % 4, fila = Math.floor(i / 4);
    el.style.left = (6 + col * 24 + Math.random() * 6) + "%";
    el.style.top = (8 + fila * 26 + Math.random() * 8) + "%";
    el.style.transform = "rotate(" + ((Math.random() - .5) * 14) + "deg)";
    el.style.setProperty("--giro", ((Math.random() - .5) * 60) + "deg");
    el.style.zIndex = String(10 + i);
    pila.appendChild(el);
  });
  // el barrido: caen en cascada
  setTimeout(function () {
    var docs = pila.children;
    for (var i = 0; i < docs.length; i++) {
      (function (el, i) {
        setTimeout(function () { el.classList.add("solo"); el.style.animation =
          "caer 1.1s cubic-bezier(.5,.05,.9,.4) forwards"; }, i * 110);
      })(docs[i], i);
    }
  }, 1900);
})();
</script>

<script>
(function () {
