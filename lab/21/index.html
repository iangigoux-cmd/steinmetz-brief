<style>
  :root { --fondo:#0c0c0d; --claro:#e9e7e2; --medio:#67655f; --acero:#9aa0a8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--fondo); color:var(--claro);
    font-family:"Archivo",sans-serif; height:100svh; overflow:hidden;
    -webkit-font-smoothing:antialiased; }
  ::selection { background:var(--claro); color:var(--fondo); }

  .marco { height:100svh; display:grid; grid-template-rows:auto 1fr auto;
    padding:clamp(1.4rem,3vw,2.4rem); }

  header, footer { display:flex; justify-content:space-between;
    font-family:"IBM Plex Mono",monospace; font-size:.68rem;
    letter-spacing:.22em; color:var(--medio); }
  header b { color:var(--claro); font-weight:500; }

  main { position:relative; display:flex; flex-direction:column;
    justify-content:center; overflow:hidden; }

  /* ── la barra de la prensa: baja, golpea, sube ── */
  .prensa { position:absolute; left:0; right:0; top:-18%;
    height:clamp(2.2rem,6vh,4rem);
    background:linear-gradient(to bottom, #2a2b2e, #1a1b1d 60%, #101112);
    border-bottom:3px solid var(--acero);
    box-shadow:0 18px 60px rgba(0,0,0,.7);
    animation:prensar 4.2s cubic-bezier(.7,0,.3,1) 1s infinite; }
  .prensa::after { content:"PRENSA HIDRÁULICA — 400 T"; position:absolute;
    left:50%; top:50%; transform:translate(-50%,-50%);
    font-family:"IBM Plex Mono",monospace; font-size:.56rem;
    letter-spacing:.34em; color:#55575c; }
  @keyframes prensar {
    0%, 12%  { transform:translateY(0); }
    30%      { transform:translateY(58%); }   /* baja y aprieta */
    46%      { transform:translateY(58%); }   /* mantiene */
    64%, 100%{ transform:translateY(0); }     /* libera */
  }

  h1 { font-size:clamp(3rem,9.4vw,8.6rem); font-weight:850;
    line-height:.96; letter-spacing:-.015em; text-transform:uppercase;
    font-stretch:125%; }
  h1 span.letra { display:inline-block; font-stretch:inherit;
    /* cada letra recibe su propio font-stretch desde JS */ }
  h1 .fila2 { display:block; color:var(--medio); }
  h1 .fila2 b { color:var(--claro); font-weight:850; }

  .bajada { margin-top:2rem; max-width:34em;
    font-family:"IBM Plex Mono",monospace; font-size:clamp(.76rem,1vw,.88rem);
    line-height:1.9; letter-spacing:.03em; color:var(--medio);
    opacity:0; animation:fundir .8s ease-out 1.4s forwards; }
  .bajada b { color:var(--claro); font-weight:500; }
  .cta { display:inline-block; align-self:start; margin-top:1.8rem;
    font-family:"IBM Plex Mono",monospace; font-size:.75rem; font-weight:500;
    letter-spacing:.24em; text-decoration:none; color:var(--fondo);
    background:var(--claro); padding:1.1em 2.3em;
    opacity:0; animation:fundir .8s ease-out 1.7s forwards;
    transition:letter-spacing 300ms cubic-bezier(.19,1,.22,1); }
  .cta:hover { letter-spacing:.4em; }
  @keyframes fundir { to { opacity:1; } }

  @media (prefers-reduced-motion:reduce) {
    .prensa { animation:none; }
    .bajada, .cta { animation:none; opacity:1; }
  }
</style>
</head>
<body>
<div class="marco">
  <header>
    <b>STEINMETZ</b>
    <span>CONSULTORÍA EN IA</span>
  </header>

  <main>
    <div class="prensa" aria-hidden="true"></div>
    <h1 id="titular" aria-label="Forjado, no prometido.">
      <span class="fila1"></span>
      <span class="fila2"></span>
    </h1>
    <p class="bajada">Cada sistema pasa por la misma prensa: <b>datos reales,
    presión de producción, cero holgura.</b> Lo que sale de aquí no se
    promete — queda forjado en tu operación.</p>
    <a class="cta" href="mailto:ian@steinmetz.cl">FORJAR EL MÍO</a>
  </main>

  <footer>
    <span>SANTIAGO DE CHILE</span>
    <span>LAB 21 — LA PRENSA</span>
  </footer>
</div>

<script>
/* La prensa comprime la tipografía: una onda de presión recorre las letras
   (eje wdth de la variable font) sincronizada con la barra que baja.
   El cursor agrega presión local. */
(function () {
  var reducido = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var fila1 = document.querySelector(".fila1");
  var fila2 = document.querySelector(".fila2");

  function letras(el, txt, negrita) {
    txt.split("").forEach(function (ch) {
      if (ch === " ") { el.insertAdjacentHTML("beforeend", " "); return; }
      var s = document.createElement("span");
      s.className = "letra"; s.textContent = ch;
      if (negrita) s.style.color = "var(--claro)";
      el.appendChild(s);
    });
  }
  letras(fila1, "FORJADO,");
  letras(fila2, "NO PROMETIDO.", true);

  var todas = Array.prototype.slice.call(document.querySelectorAll(".letra"));
  if (reducido) { todas.forEach(function (s) { s.style.fontStretch = "125%"; }); return; }

  var mx = -1e4, my = -1e4;
  addEventListener("pointermove", function (e) { mx = e.clientX; my = e.clientY; }, { passive: true });

  var t0 = performance.now();
  var actual = todas.map(function () { return 125; });
  function frame(now) {
    // fase de la prensa: el mismo ciclo de 4.2s con 1s de delay del CSS
    var t = ((now - t0) / 1000 - 1) % 4.2;
    if (t < 0) t = 0;
    var fase = t / 4.2;
    // presión global: sube al bajar la barra (12%..46% del ciclo), luego libera
    var presion = 0;
    if (fase > 0.12 && fase < 0.30) presion = (fase - 0.12) / 0.18;
    else if (fase >= 0.30 && fase < 0.46) presion = 1;
    else if (fase >= 0.46 && fase < 0.64) presion = 1 - (fase - 0.46) / 0.18;

    todas.forEach(function (s, i) {
      // la onda recorre de izquierda a derecha con leve retardo por letra
      var onda = presion * (0.75 + 0.25 * Math.sin(i * 0.7 - fase * 12));
      // presión local del cursor
      var r = s.getBoundingClientRect();
      var d = Math.hypot(mx - (r.left + r.width / 2), my - (r.top + r.height / 2));
      var local = Math.max(0, 1 - d / 260);
      var objetivo = 125 - (onda * 55 + local * 40);        // wdth 125 → ~62
      objetivo = Math.max(62, objetivo);
      actual[i] += (objetivo - actual[i]) * 0.2;
      s.style.fontStretch = actual[i].toFixed(1) + "%";
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

<script>
(function () {
  var seq = [1, 3, 4, 5, 7, 9, 11, 13, 14, 15, 17, 18, 19, 20, 21];
  var n = parseInt(location.pathname.match(/lab\/(\d+)/)[1], 10);
  var i = seq.indexOf(n);
  document.querySelectorAll(".lab-nav a")[i + 1].classList.add("aqui");
  addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" && i < seq.length - 1) location.href = "/lab/" + seq[i + 1] + "/";
    if (e.key === "ArrowLeft" && i > 0) location.href = "/lab/" + seq[i - 1] + "/";
